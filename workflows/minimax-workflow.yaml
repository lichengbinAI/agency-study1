name: "MiniMax 工作流示例"
description: "使用 MiniMax 2.7 模型的多角色协作工作流"

agents_dir: "agency-agents-zh"

llm:
  provider: "openai"
  model: "MiniMax-M2.7"
  base_url: "https://api.minimaxi.com/v1"
  api_key: "sk-cp-UNaeOhiAHl3wVcqVQgEJUGJp_1UUXhV-GLbn0-zXpKZWeCdKcbYhfst32QbuJ3ICIytNH8N499PoD6lDyEuUz1FeRNZ3xl-w9d8Q-G9-cMjWO5aujpuuDrw"
  max_tokens: 4096
  timeout: 120000
  retry: 3

concurrency: 2

inputs:
  - name: task_content
    description: "任务内容"
    required: true

steps:
  - id: analyze
    role: "academic/academic-narratologist"
    task: "{{task_content}}"
    output: result

  - id: review
    role: "academic/academic-psychologist"
    task: |
      对以下内容进行评审：

      {{result}}

      输出格式：
      ### 评审结论
      ### 建议改进
    output: review_result
    depends_on: [analyze]
